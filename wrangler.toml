name = "tickers-tracker"
main = "custom-worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Accounts are D1-only in production. Watchlists run in dual mode until the
# KV -> D1 backfill has been verified, then switch TICKER_BACKEND to "d1".
[vars]
AUTH_BACKEND = "d1"
TICKER_BACKEND = "dual"

# Runs every five minutes. The handler filters venues that are closed, so a
# 24/7 trigger costs no upstream call outside market hours.
[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[kv_namespaces]]
binding = "KV"
id = "d6b4aa8e710d442d97e6c52b1027f92c"

[[kv_namespaces]]
binding = "ticker_tracker_kv"
id = "d6b4aa8e710d442d97e6c52b1027f92c"

# Accounts live in D1 from the account migration onwards.
# Local development uses `.wrangler/state`.
[[d1_databases]]
binding = "DB"
database_name = "tickertracker-d1"
database_id = "4ff69e7d-4a6f-4c5c-ad2e-5bc97f788a66"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
